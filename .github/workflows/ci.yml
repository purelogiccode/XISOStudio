name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CSharp_XISOStudio.sln

      - name: Build (Release)
        run: dotnet build CSharp_XISOStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test CSharp_XISOStudio.sln -c Release --no-build --logger "console;verbosity=minimal"

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.rid }}
        run: dotnet publish XISOStudio -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -o artifacts/${{ matrix.rid }}

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
